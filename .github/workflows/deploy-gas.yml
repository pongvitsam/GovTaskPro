name: Deploy Google Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'src/**'
      - 'scripts/build-gas.mjs'
      - 'scripts/deploy.mjs'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

concurrency:
  group: gas-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build:gas

